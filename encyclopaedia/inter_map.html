        romaeast: 'europa_polys',
        romaisles: 'europa_polys',
        romamain: 'europa_polys',

        osthoj: 'ostjord_polys',
        valland: 'ostjord_polys',

        bedoamt: 'sahra_polys',
        kmt: 'sahra_polys',

        assyria: 'sharqaan_polys',
        babylonia: 'sharqaan_polys',
        phoenicia: 'sharqaan_polys'

    };


    /* =====================================================
       HIDE ALL POLYGON GROUPS
       ===================================================== */

    function hideAllPolygonGroups() {

        Object.keys(polygonGroups).forEach(function (key) {

            const group = polygonGroups[key];

            if (group) {
                group.style.display = 'none';
            }

        });

    }


    /* =====================================================
       SHOW GROUP
       ===================================================== */

    function showGroup(groupId) {

        const group =
            document.getElementById(groupId);

        if (group) {

            group.style.display = 'block';

            group.style.pointerEvents = 'auto';

            console.log(
                'Showing polygon group:',
                groupId
            );

        }

    }


    /* =====================================================
       HIGHLIGHTS
       ===================================================== */

    function hideAllHighlights() {

        highlightLayers.forEach(function (layer) {

            layer.classList.remove('visible');

        });

    }


    /* =====================================================
       GET POLYGON ID
       ===================================================== */

    function getPolygonId(poly) {

        return poly.getAttribute('id');

    }


    /* =====================================================
       ADD EVENTS TO POLYGON
       ===================================================== */

    function attachPolygonEvents(poly) {

        const id =
            getPolygonId(poly);

        if (!id) return;


        const highlight =
            document.getElementById(
                'highlight_' + id
            );


        /* -----------------------------------------------
           HOVER
           ----------------------------------------------- */

        poly.addEventListener(
            'mouseenter',
            function () {

                if (highlight) {

                    highlight.classList.add(
                        'visible'
                    );

                }

            }
        );


        poly.addEventListener(
            'mouseleave',
            function () {

                if (highlight) {

                    highlight.classList.remove(
                        'visible'
                    );

                }

            }
        );


        /* -----------------------------------------------
           CLICK
           ----------------------------------------------- */

        poly.addEventListener(
            'click',
            function () {

                console.log(
                    'Clicked:',
                    id
                );


                /* ---------------------------------------
                   HIGHLIGHT
                   --------------------------------------- */

                if (highlight) {

                    hideAllHighlights();

                    highlight.classList.add(
                        'visible'
                    );

                }


                /* ---------------------------------------
                   DETERMINE CHILD GROUP
                   --------------------------------------- */

                const childGroupId =
                    hierarchy[id];


                /* ---------------------------------------
                   EUROPA REALM
                   --------------------------------------- */

                if (
                    id === 'europa1' ||
                    id === 'europa2' ||
                    id === 'europa3' ||
                    id === 'europa4'
                ) {

                    mapBox.className =
                        id + ' realm';

                    hideAllPolygonGroups();

                    showGroup(
                        'europa_polys'
                    );

                    return;
                }


                /* ---------------------------------------
                   NORMAL REALM → LEVEL 2
                   --------------------------------------- */

                if (
                    id === 'aegeas' ||
                    id === 'ostjord' ||
                    id === 'sahra' ||
                    id === 'sharqaan'
                ) {

                    mapBox.className =
                        id + ' realm';

                    hideAllPolygonGroups();

                    if (childGroupId) {

                        showGroup(
                            childGroupId
                        );

                    }

                    return;
                }


                /* ---------------------------------------
                   LEVEL 2 → LEVEL 3
                   --------------------------------------- */

                if (childGroupId) {

                    mapBox.className =
                        id + ' subrealm';

                    hideAllPolygonGroups();

                    showGroup(
                        childGroupId
                    );

                    console.log(
                        'Showing child group:',
                        childGroupId
                    );

                    return;
                }


                /* ---------------------------------------
                   LEVEL 3 POLYGON
                   ---------------------------------------

                   These are the final polygons.

                   Clicking one keeps the current zoom
                   and highlight active.
                   --------------------------------------- */

                mapBox.classList.add(
                    'subsubrealm'
                );

            }
        );

    }


    /* =====================================================
       ATTACH EVENTS TO ALL POLYGONS
       ===================================================== */

    document
        .querySelectorAll(
            'svg polygon'
        )
        .forEach(function (poly) {

            attachPolygonEvents(poly);

        });


    /* =====================================================
       INITIAL STATE
       ===================================================== */

    hideAllPolygonGroups();

    realmPolys.style.display =
        'block';

    realmPolys.style.pointerEvents =
        'auto';


    /* =====================================================
       ESCAPE = RETURN TO FULL MAP
       ===================================================== */

    document.addEventListener(
        'keydown',
        function (e) {

            if (e.key !== 'Escape') {
                return;
            }


            console.log(
                'Escape pressed — resetting map.'
            );


            /* Reset zoom */

            mapBox.className =
                '';


            /* Remove highlights */

            hideAllHighlights();


            /* Hide all polygon groups */

            hideAllPolygonGroups();


            /* Return to realm polygons */

            realmPolys.style.display =
                'block';

            realmPolys.style.pointerEvents =
                'auto';

        }
    );


    /* =====================================================
       NAVIGATION TREE
       ===================================================== */

    const persistentNav = new Set();

    function getNavItem(id) {

        const items =
            document.getElementsByClassName(
                'mn_' + id
            );

        return items.length
            ? items[0]
            : null;
    }


    function showNavItem(id) {

        const item = getNavItem(id);

        if (item) {
            item.style.display =
                'inline-block';
        }
    }


    function hideNavItem(id) {

        const item = getNavItem(id);

        if (
            item &&
            !persistentNav.has(id)
        ) {
            item.style.display =
                'none';
        }
    }


    function clearNavigation() {

        persistentNav.clear();

        document
            .querySelectorAll('.map_nav .mn')
            .forEach(function (item) {

                if (
                    !item.classList.contains(
                        'mn_buffer'
                    )
                ) {
                    item.style.display =
                        'none';
                }

            });
    }


    document
        .querySelectorAll('svg polygon')
        .forEach(function (poly) {

            const id =
                poly.getAttribute('id');

            if (!id) return;


            poly.addEventListener(
                'mouseenter',
                function () {

                    showNavItem(id);

                }
            );


            poly.addEventListener(
                'mouseleave',
                function () {

                    hideNavItem(id);

                }
            );


            poly.addEventListener(
                'click',
                function () {

                    persistentNav.add(id);

                    showNavItem(id);

                }
            );

        });


    document.addEventListener(
        'keydown',
        function (e) {

            if (e.key === 'Escape') {

                clearNavigation();

            }

        }
    );

});
</script>
